name: build-windows

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller PyMuPDF
      - name: Build
        run: pyinstaller statementsift.spec
      - name: Package
        run: Compress-Archive -Path dist/StatementSift -DestinationPath StatementSift-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StatementSift-Windows
          path: StatementSift-Windows.zip
